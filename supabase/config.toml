project_id = "onoffv2"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54332
shadow_port = 54330
major_version = 17

[studio]
enabled = true
port = 54333

[inbucket]
enabled = true
port = 54334
smtp_port = 54335
pop3_port = 54336

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = false

# Enable the token hook before OAuth, after applying the MCP migration.
# The hosted project is configured separately; see docs/runbooks/mcp-setup.md.
[auth.hook.custom_access_token]
enabled = false
uri = "pg-functions://postgres/public/onoff_mcp_access_token_hook"

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false
